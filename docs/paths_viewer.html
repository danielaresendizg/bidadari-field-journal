pathsGeojson.features.forEach(f => { counts[f.properties.highway] = (counts[f.properties.highway]||0) + 1; });
Object.keys(counts).forEach(k => {
  const el = document.getElementById('count-' + k);
  if (el) el.textContent = counts[k];
});

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [103.8735, 1.3382],
  zoom: 16.3,
  pitch: 0
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let activeCats = new Set(['footway','cycleway','steps']);

function applyFilter() {
  map.setFilter('paths-line', ['in', ['get','highway'], ['literal', Array.from(activeCats)]]);
}

map.on('load', () => {
  map.addSource('paths', { type: 'geojson', data: pathsGeojson });
  map.addLayer({
    id: 'paths-line', type: 'line', source: 'paths',
    layout: { 'line-cap': 'round' },
    paint: {
      'line-color': ['match', ['get','highway'],
        'footway', '#FFD700',
        'cycleway', '#38BDF8',
        'steps', '#FF6B6B',
        '#999999'],
      'line-width': ['match', ['get','highway'], 'steps', 4, 2.5]
    }
  });

  map.on('click', 'paths-line', (e) => {
    const p = e.features[0].properties;
    const html = `<div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px">
      <div style="font-weight:700;margin-bottom:4px">${p.highway.charAt(0).toUpperCase()+p.highway.slice(1)}</div>
      ${p.name ? `<div>Name: ${p.name}</div>` : ''}
      ${p.surface ? `<div>Surface: ${p.surface}</div>` : ''}
    </div>`;
    new maplibregl.Popup({ closeButton: true }).setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on('mouseenter', 'paths-line', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'paths-line', () => { map.getCanvas().style.cursor = ''; });

  map.addSource('photos', { type: 'geojson', data: photosGeojson });
  map.addLayer({
    id: 'photos-points', type: 'circle', source: 'photos',
    paint: {
      'circle-radius': 4,
      'circle-color': ['match', ['get','category'],
        'biotic', '#38BDF8',
        'abiotic', '#0000FF',
        'human', '#172554',
        '#93C5FD'],
      'circle-stroke-width': 1,
      'circle-stroke-color': '#ffffff',
      'circle-opacity': 0.85
    }
  });
});

document.querySelectorAll('.legend-row[data-cat]').forEach(row => {
  row.addEventListener('click', () => {
    const cat = row.dataset.cat;
    if (activeCats.has(cat)) { activeCats.delete(cat); row.classList.add('dim'); }
    else { activeCats.add(cat); row.classList.remove('dim'); }
    applyFilter();
  });
});

document.querySelectorAll('.legend-row[data-layer]').forEach(row => {
  row.addEventListener('click', () => {
    const visible = map.getLayoutProperty('photos-points', 'visibility') !== 'none';
    map.setLayoutProperty('photos-points', 'visibility', visible ? 'none' : 'visible');
    row.classList.toggle('dim', visible);
  });
});
