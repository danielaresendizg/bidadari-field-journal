const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [103.8735, 1.3382],
  zoom: 16.3,
  pitch: 60,
  bearing: -15,
  maxPitch: 85
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

map.on('load', () => {
  map.addSource('terrain-dem', {
    type: 'raster-dem',
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    encoding: 'terrarium',
    tileSize: 256,
    maxzoom: 15
  });
  map.setTerrain({ source: 'terrain-dem', exaggeration: 3 });
  map.addLayer({
    id: 'hillshade',
    type: 'hillshade',
    source: 'terrain-dem',
    paint: { 'hillshade-exaggeration': 0.5 }
  });
  map.setSky({
    'sky-color': '#e9f2ff',
    'sky-horizon-blend': 0.5,
    'horizon-color': '#f7f9fb',
    'horizon-fog-blend': 0.5,
    'fog-color': '#f7f9fb',
    'fog-ground-blend': 0.3
  });
  map.addLayer({
    id: 'buildings-3d',
    type: 'fill-extrusion',
    source: 'openmaptiles',
    'source-layer': 'building',
    minzoom: 13,
    paint: {
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-color': '#d6d6d6',
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 5],
      'fill-extrusion-opacity': 0.85
    }
  });
});

map.on('load', () => {
  map.addSource('park', { type: 'geojson', data: parkGeojson });
  map.addLayer({ id: 'park-fill', type: 'fill', source: 'park', paint: { 'fill-color': '#c6da52', 'fill-opacity': 0.35 } });
  map.addLayer({ id: 'park-line', type: 'line', source: 'park', paint: { 'line-color': '#c6da52', 'line-width': 2 } });

  map.addSource('water', { type: 'geojson', data: waterGeojson });
  map.addLayer({ id: 'water-fill', type: 'fill', source: 'water', paint: { 'fill-color': '#0000FF', 'fill-opacity': 0.75 } });
  map.addLayer({ id: 'water-line', type: 'line', source: 'water', paint: { 'line-color': '#0000FF', 'line-width': 1 } });

  map.addSource('streams', { type: 'geojson', data: streamsGeojson });
  map.addLayer({
    id: 'streams-fill', type: 'fill', source: 'streams',
    filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'fill-color': '#0000FF', 'fill-opacity': 0.75 }
  });
  map.addLayer({
    id: 'streams-line', type: 'line', source: 'streams',
    filter: ['==', ['geometry-type'], 'LineString'],
    paint: { 'line-color': '#000000', 'line-width': 3, 'line-dasharray': [2, 1.5] }
  });

  map.addSource('humanCorridor', { type: 'geojson', data: humanCorridorGeojson });
  map.addLayer({
    id: 'human-corridor-line', type: 'line', source: 'humanCorridor',
    layout: { 'line-cap': 'round' },
    paint: { 'line-color': '#000000', 'line-width': 3 }
  });
});
